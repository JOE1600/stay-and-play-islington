name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  # Redeploy every 6 hours so fixtures.json follows changes to the official schedule.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Publish only the public website. Backend source and docs stay out of the site.
      - name: Assemble public site
        run: |
          mkdir _site
          cp index.html script.js config.js styles.css hotel-explorer.css _site/
          cp -R assets _site/
      # fixtures.json lists upcoming home games for the match picker, built with the API's own
      # parser. If the official site is down the step is skipped and the page shows its fallback.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish upcoming fixtures
        continue-on-error: true
        run: dotnet run --project backend/backend.csproj --no-launch-profile -c Release -p:BoxwoodTargetFramework=net10.0 -- --export-fixtures "$GITHUB_WORKSPACE/_site/fixtures.json"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
